<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="icon" href="./assests/sonic.ico" type="image/x-icon">
  <link rel="stylesheet" href="./style.css">
  <title>Sonic HTML5 - Green Hill Zone</title>
</head>
<body>

  <div id="game-root">
    <!-- Iconic Sonic Logo & Story Mission -->
    <header class="game-header">
      <img src="./assests/gameLogo.png" alt="Sonic HTML5" class="game-logo">
      <p class="story-tag">Eggman has the Chaos Emeralds! Collect all 50 rings to catch him!</p>
    </header>

    <!-- Retro Top HUD -->
    <div class="arcade-top-hud">
      <div class="hud-title-wrap">
        <span class="hud-zone-tag">GREEN HILL ZONE</span>
        <span class="hud-badge">ACT 1</span>
      </div>
      <div class="hud-actions">
        <button id="ctrl-mute" class="hud-btn" type="button" title="Toggle Sound">🔊</button>
        <button id="ctrl-restart" class="hud-btn" type="button" title="Restart Game">🔄 RETRY</button>
      </div>
    </div>

    <!-- Scalable Game Screen Viewport -->
    <div id="game-stage-wrapper">
      <div id="game-stage-scaler">
        <div class="background">
          <!-- Main Character: Sonic -->
          <div class="sonic"></div>

          <!-- Collectibles: Rings (1 to 50) -->

          <div class="ring2"></div>

          <div class="ring4"></div>
          <div class="ring5"></div>
          <div class="ring6"></div>
          <div class="ring7"></div>
          <div class="ring8"></div>
          <div class="ring9"></div>
          <div class="ring10"></div>
          <div class="ring11"></div>
          <div class="ring12"></div>
          <div class="ring13"></div>
          <div class="ring14"></div>
          <div class="ring15"></div>
          <div class="ring16"></div>
          <div class="ring17"></div>
          <div class="ring18"></div>
          <div class="ring19"></div>
          <div class="ring20"></div>
          <div class="ring21"></div>
          <div class="spikes"></div>
          <div class="ring22"></div>
          <div class="ring23"></div>
          <div class="ring24"></div>
          <div class="ring25"></div>
          <div class="ring26"></div>
          <div class="ring27"></div>
          <div class="ring28"></div>
          <div class="ring29"></div>
          <div class="ring30"></div>
          <div class="ring31"></div>
          <div class="ring32"></div>
          <div class="ring33"></div>
          <div class="ring34"></div>
          <div class="ring35"></div>
          <div class="ring36"></div>
          <div class="ring37"></div>
          <div class="ring38"></div>
          <div class="ring39"></div>
          <div class="ring40"></div>
          <div class="ring41"></div>
          <div class="ring42"></div>
          <div class="ring43"></div>
          <div class="ring44"></div>
          <div class="ring45"></div>
          <div class="ring46"></div>
          <div class="ring47"></div>
          <div class="ring48"></div>
          <div class="ring49"></div>
          <div class="ring50"></div>

          <!-- Boss: Dr. Eggman -->
          <div class="eggman"></div>

          <!-- Spikes Obstacles -->
          <div class="spikes2"></div>
          <div class="spikes3"></div>
          <div class="spikes4"></div>
          <div class="spikes5"></div>

          <!-- In-Canvas HUD Elements -->
          <div class="score">
            <span style="color: #ffd700;">RINGS:</span>
            <span style="color: #ffffff;" id="puntaje">0</span><span style="color: #ffffff;">/50</span>
          </div>

          <div class="keep">
            <span style="color: #ff3b30;">KEEP RUNNING</span>
          </div>

          <div class="eggman2"></div>

          <div class="win">
            <span style="color: #ffd700;">YOU WIN!!!</span>
          </div>
          <div class="die">
            <span style="color: #ff3b30;">GAME OVER</span>
          </div>
        </div>
      </div>

      <!-- In-Game Game Over Modal -->
      <div id="game-over-modal" class="game-modal">
        <div class="modal-content">
          <h2 class="modal-title lose">GAME OVER</h2>
          <p class="modal-desc">Sonic hit the spikes! Dr. Eggman escaped with the Chaos Emeralds.</p>
          <button id="btn-retry" class="modal-btn" type="button">▶ TRY AGAIN</button>
        </div>
      </div>

      <!-- In-Game Victory Modal -->
      <div id="game-win-modal" class="game-modal">
        <div class="modal-content">
          <h2 class="modal-title win">STAGE CLEAR!</h2>
          <p class="modal-desc">You collected all the rings and chased down Dr. Eggman!</p>
          <button id="btn-win-again" class="modal-btn" type="button">▶ PLAY AGAIN</button>
        </div>
      </div>
    </div>

    <!-- Tactile On-Screen Mobile Gamepad Buttons -->
    <div id="mobile-controls">
      <!-- D-Pad Left / Right -->
      <div class="dpad-container">
        <button id="ctrl-left" class="ctrl-btn" type="button" aria-label="Move Left">
          <span class="icon">◀</span>
          <span class="label">LEFT</span>
        </button>
        <button id="ctrl-right" class="ctrl-btn" type="button" aria-label="Move Right">
          <span class="icon">▶</span>
          <span class="label">RIGHT</span>
        </button>
      </div>

      <!-- Jump Button -->
      <div class="action-container">
        <button id="ctrl-jump" class="jump-btn" type="button" aria-label="Jump">
          <span class="icon">▲</span>
          <span class="label">JUMP</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Dynamic Responsive Scaling Script -->
  <script>
    function updateGameScale() {
      const wrapper = document.getElementById('game-stage-wrapper');
      const scaler = document.getElementById('game-stage-scaler');
      if (!wrapper || !scaler) return;

      const root = document.getElementById('game-root');
      let availableWidth = (root && root.clientWidth > 100) ? root.clientWidth : (window.innerWidth || 900);
      
      const targetWidth = 900;
      const targetHeight = 240;

      // Safe clamp: never 0!
      const scale = Math.min(1.0, Math.max(0.35, availableWidth / targetWidth));
      scaler.style.transform = 'scale(' + scale + ')';
      scaler.style.transformOrigin = 'top left';

      wrapper.style.width = Math.ceil(targetWidth * scale) + 'px';
      wrapper.style.height = Math.ceil(targetHeight * scale) + 'px';
      wrapper.style.margin = '0 auto';
    }

    window.addEventListener('resize', updateGameScale);
    window.addEventListener('orientationchange', updateGameScale);
    window.addEventListener('DOMContentLoaded', updateGameScale);
    window.addEventListener('load', updateGameScale);
    updateGameScale();

    if (window.ResizeObserver) {
      new ResizeObserver(updateGameScale).observe(document.body);
    }
  </script>

  <!-- Game Engine Logic -->
  <script src="script2.js"></script>
</body>
</html>
